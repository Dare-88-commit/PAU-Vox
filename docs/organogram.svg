<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .box { fill: #f7f7f9; stroke: #1f2937; stroke-width: 1.5; rx: 10; }
      .title { font: 600 18px Arial, sans-serif; fill: #111827; }
      .label { font: 14px Arial, sans-serif; fill: #111827; }
      .muted { font: 12px Arial, sans-serif; fill: #6b7280; }
      .line { stroke: #374151; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Top layer -->
  <rect class="box" x="90" y="40" width="280" height="70" />
  <text class="title" x="110" y="70">University Management</text>
  <text class="muted" x="110" y="92">Analytics/Oversight</text>

  <rect class="box" x="420" y="40" width="220" height="70" />
  <text class="title" x="440" y="70">ICT Admin</text>
  <text class="muted" x="440" y="92">System Administration</text>

  <!-- Tracks -->
  <rect class="box" x="90" y="150" width="260" height="60" />
  <text class="title" x="110" y="185">Academic Track</text>

  <rect class="box" x="420" y="150" width="260" height="60" />
  <text class="title" x="440" y="185">Non-Academic Track</text>

  <!-- Academic branch -->
  <rect class="box" x="90" y="260" width="260" height="60" />
  <text class="label" x="110" y="290">Dean (per school)</text>

  <rect class="box" x="90" y="350" width="260" height="70" />
  <text class="label" x="110" y="380">Department Head(s)</text>
  <text class="muted" x="110" y="400">Multi-department allowed</text>

  <rect class="box" x="90" y="450" width="260" height="60" />
  <text class="label" x="110" y="485">Academic Staff</text>

  <rect class="box" x="90" y="530" width="260" height="70" />
  <text class="label" x="110" y="560">Course Coordinator</text>
  <text class="muted" x="110" y="580">Intermediary</text>

  <!-- Non-academic branch -->
  <rect class="box" x="420" y="260" width="260" height="60" />
  <text class="label" x="440" y="290">Head Student Affairs</text>

  <rect class="box" x="420" y="350" width="260" height="60" />
  <text class="label" x="440" y="385">Student Affairs Officers</text>

  <rect class="box" x="720" y="260" width="260" height="60" />
  <text class="label" x="740" y="290">Head Security</text>

  <rect class="box" x="720" y="350" width="260" height="60" />
  <text class="label" x="740" y="385">Security Supervisor</text>

  <rect class="box" x="720" y="440" width="260" height="60" />
  <text class="label" x="740" y="475">Security Staff</text>

  <rect class="box" x="1020" y="260" width="260" height="60" />
  <text class="label" x="1040" y="290">Head Maintenance</text>

  <rect class="box" x="1020" y="350" width="260" height="60" />
  <text class="label" x="1040" y="385">Maintenance Staff</text>

  <rect class="box" x="1320" y="260" width="260" height="60" />
  <text class="label" x="1340" y="290">Head Facilities</text>

  <rect class="box" x="1320" y="350" width="260" height="60" />
  <text class="label" x="1340" y="385">Facilities Staff</text>

  <rect class="box" x="1320" y="440" width="260" height="60" />
  <text class="label" x="1340" y="475">Facilities Account</text>

  <rect class="box" x="1020" y="470" width="260" height="60" />
  <text class="label" x="1040" y="505">Head Cafeteria</text>

  <rect class="box" x="1020" y="560" width="260" height="60" />
  <text class="label" x="1040" y="595">Cafeteria Staff</text>

  <!-- Lines from top -->
  <line class="line" x1="230" y1="110" x2="220" y2="150" />
  <line class="line" x1="530" y1="110" x2="550" y2="150" />

  <!-- Academic lines -->
  <line class="line" x1="220" y1="210" x2="220" y2="260" />
  <line class="line" x1="220" y1="320" x2="220" y2="350" />
  <line class="line" x1="220" y1="420" x2="220" y2="450" />
  <line class="line" x1="220" y1="510" x2="220" y2="530" />

  <!-- Non-academic lines -->
  <line class="line" x1="550" y1="210" x2="550" y2="260" />
  <line class="line" x1="550" y1="320" x2="550" y2="350" />

  <line class="line" x1="550" y1="290" x2="720" y2="290" />
  <line class="line" x1="850" y1="320" x2="850" y2="350" />
  <line class="line" x1="850" y1="410" x2="850" y2="440" />

  <line class="line" x1="550" y1="290" x2="1020" y2="290" />
  <line class="line" x1="1150" y1="320" x2="1150" y2="350" />

  <line class="line" x1="550" y1="290" x2="1320" y2="290" />
  <line class="line" x1="1450" y1="320" x2="1450" y2="350" />
  <line class="line" x1="1450" y1="410" x2="1450" y2="440" />

  <line class="line" x1="1150" y1="410" x2="1150" y2="470" />
  <line class="line" x1="1150" y1="530" x2="1150" y2="560" />
</svg>
